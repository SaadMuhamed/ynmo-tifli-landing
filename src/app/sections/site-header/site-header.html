<div class="bar" [class.bar--scrolled]="scrolled()">
  <a class="logo" href="#" [attr.aria-label]="header.logoAriaLabel">
    <picture>
      <source srcset="/assets/icons/site-header/logo.webp" type="image/webp" />
      <img src="/assets/icons/site-header/logo.png" alt="" />
    </picture>
  </a>

  <nav class="nav" [attr.aria-label]="header.navAriaLabel">
    <ul class="nav__list">
      @for (link of header.navLinks; track link.label; let i = $index) {
        <li class="nav__item">
          <a
            class="nav__link"
            [class.nav__link--active]="i === header.activeNavIndex"
            [href]="link.href"
            [attr.aria-current]="i === header.activeNavIndex ? 'page' : null"
          >
            {{ link.label }}
            @if (i === header.activeNavIndex) {
              <img class="nav__chevron" src="/assets/icons/site-header/chevron-tab.svg" alt="" />
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="utility">
    <button class="utility__lang" type="button" [attr.aria-label]="header.langAriaLabel">
      <img class="utility__chevron" src="/assets/icons/site-header/chevron-lang.svg" alt="" />
      <span class="utility__flag" aria-hidden="true">🇸🇦</span>
    </button>
    <button class="utility__search" type="button" [attr.aria-label]="header.searchAriaLabel">
      <img src="/assets/icons/site-header/magnifier.svg" alt="" />
    </button>
  </div>

  <a class="cta" [href]="header.ctaHref">
    <span class="cta__task-icon">
      <img src="/assets/icons/site-header/task-daily.svg" alt="" />
    </span>
    <span class="cta__label">{{ header.ctaLabel }}</span>
    <span class="cta__badge">
      <img src="/assets/icons/site-header/chevron-cta.svg" alt="" />
    </span>
  </a>

  <button
    class="hamburger"
    type="button"
    [attr.aria-label]="header.hamburgerAriaLabel"
    [attr.aria-expanded]="drawerOpen()"
    aria-controls="site-header-drawer"
    (click)="toggleDrawer()"
  >
    <span></span><span></span><span></span>
  </button>
</div>

<div
  id="site-header-drawer"
  class="drawer"
  [class.drawer--open]="drawerOpen()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="header.drawerAriaLabel"
>
  <div class="drawer__top">
    <button class="drawer__close" type="button" [attr.aria-label]="header.drawerCloseAriaLabel" (click)="closeDrawer()">✕</button>
    <button class="drawer__lang" type="button" [attr.aria-label]="header.langAriaLabel">
      <img class="utility__chevron" src="/assets/icons/site-header/chevron-lang.svg" alt="" />
      <span aria-hidden="true">🇸🇦</span>
    </button>
  </div>
  <ul class="drawer__list">
    @for (link of header.navLinks; track link.label; let i = $index) {
      <li class="drawer__item">
        <a
          [class.drawer__link--active]="i === header.activeNavIndex"
          class="drawer__link"
          [href]="link.href"
          (click)="closeDrawer()"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
  <a class="drawer__cta" [href]="header.ctaHref" (click)="closeDrawer()">{{ header.ctaLabel }}</a>
</div>
